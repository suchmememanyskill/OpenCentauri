# Example Cosmos/Klippy input-shaper calibration drop-in.
#
# The Cosmos nightly package supplies the equivalent calibration macro itself.
# Use this example for a standalone Klippy installation, or as a reference for
# a local override. Do not define M125 if your printer.cfg already assigns it
# another purpose.

[gcode_macro M125]
description: Write a shaper-calibration status message to the UI and klippy.log.
gcode:
    { action_respond_info(rawparams) }

[gcode_shell_command RUSTY_SHAPER_START]
command: /usr/bin/klippy-rusty-shaper
timeout: 30
verbose: False

[gcode_macro SHAPER_RUSTY]
description: Collect raw X/Y resonance data and calibrate it with rusty-shaper.
gcode:
    {% set shapers = params.SHAPERS|default('') %}

    M125 Rusty Shaper: collecting X resonance data
    G28
    M400
    TEST_RESONANCES AXIS=X OUTPUT=raw_data
    G4 P1000
    M125 Rusty Shaper: collecting Y resonance data
    TEST_RESONANCES AXIS=Y OUTPUT=raw_data
    G4 P1000
    M125 Rusty Shaper: calculating input shaper
    RUN_SHELL_COMMAND CMD=RUSTY_SHAPER_START PARAMS="{shapers}"

# Examples:
#   SHAPER_RUSTY                 # Rusty's Kalico-compatible default candidates
#   SHAPER_RUSTY SHAPERS=mzv     # MZV only
#   SHAPER_RUSTY SHAPERS=mzv,ei  # Multiple Rusty candidates

[gcode_macro SHAPER_CLASSIC]
description: Calibrate with Klippy's built-in input shaper (one candidate).
gcode:
    {% set shaper = params.SHAPER|default('mzv')|lower %}

    M125 Classic Shaper: collecting X resonance data
    # Optional for configurations that define these commands:
    # RUN_SHELL_COMMAND CMD=CAMERA_STOP
    # RUN_SHELL_COMMAND CMD=GUI_STOP
    G28
    M400
    SHAPER_CALIBRATE AXIS=X FORCE_SHAPER={shaper}
    G4 P1000
    M125 Classic Shaper: collecting Y resonance data
    SHAPER_CALIBRATE AXIS=Y FORCE_SHAPER={shaper}
    G4 P1000
    # RUN_SHELL_COMMAND CMD=GUI_START
    # RUN_SHELL_COMMAND CMD=CAMERA_START

# Examples:
#   SHAPER_CLASSIC              # MZV only (the default)
#   SHAPER_CLASSIC SHAPER=ei    # One classic candidate
#
# Classic accepts one candidate: zv, mzv, zvd, ei, 2hump_ei, or 3hump_ei.
# Rusty accepts a comma-separated SHAPERS list and does not require stopping
# the camera or UI on Cosmos.
